spring:
  datasource:
    url: jdbc:h2:mem:teamflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

security:
  jwt:
    secret: test-secret-key-test-secret-key-test-secret-key-01234567
    expiration-ms: 3600000

app:
  frontend-url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173
