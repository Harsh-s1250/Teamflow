# All environment-specific values are externalized as environment variables.
# Sensible local-development fallbacks are provided after ":" so the app
# can run locally without extra setup, but nothing here is a production value.
spring:
  application:
    name: teamflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamflow}
    username: ${DB_USERNAME:teamflow}
    password: ${DB_PASSWORD:teamflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate auto-DDL.
      # "validate" makes Hibernate fail fast if the entity mapping and the
      # actual (migrated) schema ever drift apart.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend-url}}

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.teamflow: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
