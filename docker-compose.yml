# Optional convenience file for local development only.
# It does not represent a production deployment topology; it exists so a
# reviewer can bring up PostgreSQL (and optionally the backend) with one
# command without installing PostgreSQL locally.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamflow
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
    ports:
      - "5432:5432"
    volumes:
      - teamflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/teamflow
      DB_USERNAME: teamflow
      DB_PASSWORD: teamflow
      JWT_SECRET: local-dev-only-secret-change-me-please-32bytes
      JWT_EXPIRATION_MS: 3600000
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SERVER_PORT: 8080
      LOG_LEVEL: INFO

volumes:
  teamflow_pgdata:
